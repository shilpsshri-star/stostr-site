<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stostr</title>
<style>
  :root{
    --ink:#EDEEF0;
    --cover:#2B303B;
    --gold-1:#FFD84D;
    --gold-2:#F2A93C;
    --line:#5A6070;
    --muted:#B7BBC4;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 32%, #4a5160, var(--cover) 75%);
    color:var(--ink);
    font-family:"Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .gold{
    background:linear-gradient(100deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .cover{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cover img{width:min(140px, 34vw);margin-bottom:22px;}
  .cover .word{
    font-family:"Archivo",sans-serif;
    font-weight:700;
    font-size:clamp(2.8rem, 11vw, 4.6rem);
    line-height:1;
    letter-spacing:-0.01em;
  }
  .cover .tagline{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.78rem;
    letter-spacing:0.18em;
    color:var(--gold-1);
    text-transform:uppercase;
    margin-top:12px;
  }
  .cover .enter{
    margin-top:52px;
    color:var(--ink);
    text-decoration:none;
    font-size:0.9rem;
    font-weight:600;
    border:1px solid var(--line);
    padding:12px 26px;
    border-radius:999px;
    transition:border-color 0.2s, color 0.2s;
  }
  .cover .enter:hover{border-color:var(--gold-2);color:var(--gold-1);}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="cover">
  <img src="/stostr-logo.jpg" alt="stostr logo">
  <div class="word">st<span class="gold">ostr</span></div>
  <div class="tagline">Speed to onboard is speed to revenue</div>
  <a class="enter" href="/services">Enter site →</a>
</div>
</body>
</html>
